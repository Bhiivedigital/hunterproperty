  <!-- The site name Google prints above the blue link: just the brand. A full
       page title here is rejected as a site name and Google falls back to the
       bare domain. -->
  <meta property="og:site_name" content="Hunter Property">
  <meta property="og:image" content="https://www.hunterproperty.in/assets/img/logo/logo.png">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Every page is prerendered at build time, so this file is only the
       template: each route's own title, description, canonical, Open Graph
       tags and JSON-LD (WebSite, the business, breadcrumbs, FAQs...) are
       written into its HTML by SeoService and StructuredDataService during
       prerendering. -->

  <link rel="icon" type="image/png" href="./assets/img/logo/favicon.png">
  <link rel="shortcut icon" href="/favicon.ico">

  <!-- Self-hosted fonts (assets/fonts/fonts.css). The two faces used above the
       fold are preloaded so headline and body text render in the right font
       on first paint instead of swapping a moment later. -->
  <link rel="preload" href="/assets/fonts/poppins-latin-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/roboto-latin-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preconnect" href="https://cms.hunterproperty.in" crossorigin>
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>

  <!-- Google Analytics. The queue is set up immediately so the page view is
       recorded; the 180 KB library itself loads once the page has finished
       loading, instead of competing with it. -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-Y7GXWRE9XJ');
    window.addEventListener('load', function () {
      setTimeout(function () {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-Y7GXWRE9XJ';
        document.head.appendChild(s);
      }, 2000);
    });
  </script>
</head>
<body>
  <app-root></app-root>

  <!-- wow.min.js drives the theme's `wow fadeInUp`-style scroll animations
       (vanilla JS, no jQuery). bootstrap.bundle comes from angular.json's
       `scripts`. jQuery and main.js are gone: main.js only toggled the navbar's
       fixed-top class on scroll, which HeaderComponent now binds itself. -->
  <script src="assets/js/wow.min.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (window.WOW) new WOW({ live: true }).init();
    });
  </script>
