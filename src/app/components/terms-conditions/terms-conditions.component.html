<div class="site-breadcrumb" style="background: url(../../../assets/img/portfolio/05.jpg)">
    <div class="container">
        <h2 class="breadcrumb-title">Terms &amp; Conditions</h2>
        <ul class="breadcrumb-menu">
            <li><a routerLink="/">Home</a></li>
            <li class="active">Terms &amp; Conditions</li>
        </ul>
    </div>
</div>

<div class="blog-area py-120" *ngIf="page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <p class="text-muted mb-4">Last updated: {{ page.updatedDate | date:'longDate' }}</p>
                <div class="blog-single-content" [innerHTML]="page.content"></div>
            </div>
        </div>
    </div>
</div>
