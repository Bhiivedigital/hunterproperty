<ng-container *ngIf="category">

  <div class="site-breadcrumb"
       [style.background-image]="pillar?.heroImage?.url ? 'url(' + pillar!.heroImage!.url + ')' : 'url(assets/img/portfolio/02.webp)'">
    <div class="container">
      <h2 class="breadcrumb-title">{{ category.name }}</h2>
      <ul class="breadcrumb-menu">
        <li><a routerLink="/">Home</a></li>
        <li class="active">{{ category.name }}</li>
      </ul>
    </div>
  </div>

  <div class="pillar-area">

    <div class="container">
      <div class="row">
        <div class="col-lg-10 mx-auto text-center">
          <div class="site-heading text-center">
            <span class="site-title-tagline"><i [class]="category.icon || 'far fa-helmet-safety'"></i> {{ tagline }}</span>
            <h1 class="site-title" *ngIf="pillar?.heading; else defaultHeading">{{ pillar!.heading }}</h1>
            <ng-template #defaultHeading>
              <h1 class="site-title">{{ category.name }} <span>Services</span></h1>
            </ng-template>
            <div class="heading-divider"></div>
          </div>
        </div>
      </div>

      <!-- The enquiry form is first in the DOM so it is the first thing under
           the heading on a phone, where the sidebar would otherwise sit at the
           very bottom of a long article. From lg up the grid lifts it into the
           right-hand column and the copy takes the wide one. -->
      <div class="pillar-layout">

        <aside class="pillar-aside">
          <app-hero-lead-form [heading]="leadFormHeading" sourceForm="pillar-page"></app-hero-lead-form>
        </aside>

        <div class="pillar-main">

          <!-- Placed above the copy, the block zone belongs to the article, so
               it renders inside this column rather than full-bleed: an Image
               Block set to lead the page then opens the article instead of
               sitting under a heading of its own. -->
          <app-content-blocks class="pillar-inline-blocks" *ngIf="blocksAboveContent"
                              [blocks]="pillar?.contentBlocks || []"></app-content-blocks>

          <ng-container *ngTemplateOutlet="featured; context: { $implicit: 'top' }"></ng-container>

          <div class="pillar-intro cms-rich-text" *ngIf="introHtml" [innerHTML]="introHtml"></div>

          <ng-container *ngTemplateOutlet="featured; context: { $implicit: 'below-intro' }"></ng-container>

          <div class="pillar-content cms-rich-text" *ngIf="contentHtml" [innerHTML]="contentHtml"></div>

          <ng-container *ngTemplateOutlet="featured; context: { $implicit: 'below-content' }"></ng-container>

        </div>

      </div>
    </div>

    <!-- The pillar page's own body: sections, images, banners, accordions, FAQs.
         Below the copy they are page-level sections, so they run full width. -->
    <app-content-blocks *ngIf="!blocksAboveContent" [blocks]="pillar?.contentBlocks || []"></app-content-blocks>

    <!-- Editor-curated links, above the auto-generated child list. -->
    <app-quick-links *ngIf="curatedLinks"
                     [title]="curatedLinks.mainTitle"
                     [items]="curatedLinks.items"></app-quick-links>

    <app-quick-links *ngIf="showChildGuides" [title]="childGuidesTitle" [items]="pageLinks"></app-quick-links>

    <div class="container">
      <p class="text-center pillar-empty" *ngIf="showChildGuides && pages.length === 0">
        More {{ category.name }} Services are on the way.
      </p>

      <div class="text-center pillar-more" *ngIf="showChildGuides && hasMore">
        <button type="button" class="theme-btn" (click)="loadMore()" [disabled]="loadingMore">
          {{ loadingMore ? 'Loading…' : 'Load More' }}<i class="fas fa-arrow-right"></i>
        </button>
      </div>

      <div class="row pillar-cta">
        <div class="col-lg-8 mx-auto text-center">
          <div class="widget">
            <h4 class="widget-title">{{ ctaHeading }}</h4>
            <p>{{ ctaText }}</p>
            <div class="d-flex gap-3 justify-content-center flex-wrap">
              <a class="theme-btn" [routerLink]="['/services', category.slug]">See Our {{ category.name }} Service<i class="fas fa-arrow-right"></i></a>
              <a class="theme-btn" routerLink="/contactus">Contact Us<i class="fas fa-arrow-right"></i></a>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

</ng-container>

<!-- One markup block, three possible slots: the editor's featuredImagePosition
     decides which call renders it. -->
<ng-template #featured let-slot>
  <figure class="pillar-featured" *ngIf="isFeaturedAt(slot)">
    <img class="img-fluid" [src]="pillar!.featuredImage!.url"
         [srcset]="pillar!.featuredImage!.url | cldSrcset:'content'"
         [attr.sizes]="'content' | cldSizes"
         [attr.width]="pillar!.featuredImage!.width || null"
         [attr.height]="pillar!.featuredImage!.height || null"
         [alt]="pillar!.heading || category!.name" decoding="async">
  </figure>
</ng-template>
