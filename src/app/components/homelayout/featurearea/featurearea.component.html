  <!-- feature area -->
        <div class="feature-area pt-100">
            <div class="container">
                <div class="col-lg-12">
                    <div class="feature-wrap">
                        <div class="row g-4">
                            <div class="col-md-6 col-lg-4" *ngFor="let item of items; let i = index">
                                <div class="feature-item">
                                    <span class="count">{{ (i + 1) < 10 ? '0' + (i + 1) : (i + 1) }}</span>
                                    <div class="feature-icon">
                                        <img [src]="item.icon" alt="" loading="lazy">
                                    </div>
                                    <div class="feature-content">
                                        <h4>{{ item.title }}</h4>
                                        <p [innerHTML]="item.text"></p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- feature area end -->
