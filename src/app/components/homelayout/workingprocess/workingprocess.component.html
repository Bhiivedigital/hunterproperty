 <!-- process area -->
        <div class="process-area py-120">
            <div class="container">
                <div class="row">
                    <div class="col-lg-6 mx-auto">
                        <div class="site-heading text-center wow fadeInDown" data-wow-delay=".25s">
                            <span class="site-title-tagline"><i class="far fa-helmet-safety"></i> {{ tagline }}</span>
                            <h2 class="site-title" [innerHTML]="titleHtml"></h2>
                            <div class="heading-divider"></div>
                        </div>
                    </div>
                </div>
                <div class="process-wrap mt-3 wow fadeInUp" data-wow-delay=".25s">
                    <div class="row g-4">
                        <div class="col-md-6 col-lg-4 col-xl-3" *ngFor="let step of steps; let i = index">
                            <div class="process-item">
                                <span class="count">{{ (i + 1) < 10 ? '0' + (i + 1) : (i + 1) }}</span>
                                <div class="icon">
                                    <img [src]="step.icon" alt="">
                                </div>
                                <div class="content">
                                    <h4>{{ step.title }}</h4>
                                    <p>{{ step.text }}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- process area end -->
