 <!-- counter area -->
        <div class="counter-area pt-40 pb-40">
            <div class="container">
                <div class="row g-4 justify-content-center">
                    <div class="col-md-6 col-lg-4 col-xl-3" *ngFor="let stat of stats">
                        <div class="counter-item wow fadeInUp" data-wow-delay=".25s">
                            <div class="icon">
                                <img [src]="stat.icon" alt="">
                            </div>
                            <div class="content">
                                <div class="info">
                                    <span class="counter" data-count="+" [attr.data-to]="stat.value" data-speed="3000">{{ stat.value }}</span>
                                    <span class="unit">{{ stat.suffix }}</span>
                                </div>
                                <h6 class="title">{{ stat.label }}</h6>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- counter area end -->
