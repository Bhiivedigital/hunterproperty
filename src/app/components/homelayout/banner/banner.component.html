<section class="slidersec">
<owl-carousel-o [options]="customOptions">
  <ng-template carouselSlide *ngFor="let slide of banner?.slides">
    <div class="slide">
       <div class="hero-single" [style.background-image]="'url(' + slide.backgroundImage + ')'">

                </div>
    </div>
  </ng-template>
</owl-carousel-o>

  <div class="container heroslider-container">
    <div class="row align-items-center">
        <div class="col-md-12 col-lg-7">
            <div class="hero-content">
                <h6 class="hero-sub-title" data-animation="fadeInUp" data-delay=".25s">
                    <i class="fal fa-helmet-safety"></i>
                    {{ banner?.heroSubTitle }}
                </h6>
                <h1 class="hero-title" data-animation="fadeInRight" data-delay=".50s">
                    {{ banner?.heroTitleBefore }} <span>{{ banner?.heroTitleHighlight }}</span> {{ banner?.heroTitleAfter }}
                </h1>

                <div class="hero-btn" data-animation="fadeInUp" data-delay="1s">
                    <a [routerLink]="'/about'" [routerLinkActive]="'active'" class="theme-btn">About More<i class="fas fa-arrow-right"></i></a>
                    <a [routerLink]="'/contactus'" [routerLinkActive]="'active'" class="theme-btn2">Learn More<i class="fas fa-arrow-right"></i></a>
                </div>
            </div>
        </div>
        <div class="col-md-12 col-lg-5">
            <app-hero-lead-form></app-hero-lead-form>
        </div>
    </div>
</div>

<div class="hero-trust-badge">
    <i class="fas fa-shield-check"></i>
    <div class="hero-trust-badge-text">
        <strong>{{ banner?.trustBadgeTitle }}</strong>
        <span>{{ banner?.trustBadgeSubtitle }}</span>
    </div>
</div>

</section>
