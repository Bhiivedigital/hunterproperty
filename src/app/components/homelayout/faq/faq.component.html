
        <!-- faq area -->
        <div class="faq-area py-120">
            <div class="container">
                <div class="row">
                    <div class="col-lg-6">
                        <div class="faq-content wow fadeInUp" data-wow-delay=".25s">
                            <div class="site-heading mb-3">
                                <span class="site-title-tagline"><i class="far fa-helmet-safety"></i> {{ faq?.tagline }}</span>
                                <h2 class="site-title my-3" [innerHTML]="faqTitleHtml"></h2>
                            </div>
                            <p class="mb-3" [innerHTML]="faq?.introText1"></p>
                            <p class="mb-4" [innerHTML]="faq?.introText2"></p>
                            <a href="contact.html" class="theme-btn mt-2">{{ faq?.ctaText }}</a>
                        </div>
                    </div>
                    <div class="col-lg-6">
                        <div class="accordion wow fadeInRight" data-wow-delay=".25s" id="accordionExample">
                            <div class="accordion-item" *ngFor="let item of faq?.items; let i = index">
                                <h2 class="accordion-header" [id]="'heading' + i">
                                    <button class="accordion-button" [class.collapsed]="i !== 0" type="button" data-bs-toggle="collapse" [attr.data-bs-target]="'#collapse' + i" [attr.aria-expanded]="i === 0" [attr.aria-controls]="'collapse' + i">
                                        <span><i class="far fa-question"></i></span> {{ item.question }}
                                    </button>
                                </h2>
                                <div [id]="'collapse' + i" class="accordion-collapse collapse" [class.show]="i === 0" [attr.aria-labelledby]="'heading' + i" data-bs-parent="#accordionExample">
                                    <div class="accordion-body" [innerHTML]="item.answer"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- faq area end -->

    <!-- testimonial-area -->
        <div class="testimonial-area ts-bg pt-80 pb-60">
            <div class="container">
                <div class="row">
                    <div class="row">
                        <div class="col-lg-6 mx-auto">
                            <div class="site-heading text-center wow fadeInDown" data-wow-delay=".25s">
                                <span class="site-title-tagline"><i class="far fa-helmet-safety"></i> {{ testimonials?.tagline }}</span>
                                <h2 class="site-title text-white" [innerHTML]="testimonialsTitleHtml"></h2>
                                <div class="heading-divider"></div>
                            </div>
                        </div>
                    </div>
                    <div class="testimonial-slider wow fadeInUp" data-wow-delay=".25s">
                        <owl-carousel-o [options]="testmonialsSlide">
                            <ng-template carouselSlide *ngFor="let item of testimonials?.items">
                                   <div class="testimonial-item">
                            <div class="testimonial-quote">
                                <span class="testimonial-quote-icon"><i class="fal fa-quote-right"></i></span>
                                <div class="testimonial-shadow-icon">
                                    <img src="assets/img/icon/quote.svg" alt="">
                                </div>
                                <div class="testimonial-rate">
                                    <i class="fas fa-star" *ngFor="let star of [].constructor(item.rating)"></i>
                                </div>
                                <p class="review-cnt" [innerHTML]="item.quote"></p>

                                <div class="testimonial-content text-end">

                                    <div class="testimonial-author-info">
                                        <h4>{{ item.authorName }}</h4>
                                        <p>{{ item.authorRole }}</p>
                                    </div>
                                </div>
                             </div>
                        </div>
                            </ng-template>
                            </owl-carousel-o>
                       
                    </div>
                </div>
            </div>
        </div>
        <!-- testimonial-area end -->
