  <div class="site-breadcrumb" style="background: url(../../../assets/img/portfolio/04.jpg)">
            <div class="container">
                <h2 class="breadcrumb-title">Portfolio</h2>
                <ul class="breadcrumb-menu">
                    <li><a href="index.html">Home</a></li>
                    <li class="active">Portfolio</li>
                </ul>
            </div>
        </div>



<div class="portfolio-area py-120">
            <div class="container">
                <div class="row">
                    <div class="col-lg-6 mx-auto">
                        <div class="site-heading text-center">
                            <span class="site-title-tagline"><i class="far fa-helmet-safety"></i> {{ tagline }}</span>
                            <h2 class="site-title" [innerHTML]="titleHtml"></h2>
                        </div>
                    </div>
                </div>
                <div class="row g-4 popup-gallery">
                    <div class="col-lg-4 col-md-6 col-sm-6" *ngFor="let image of images">
                        <div class="portfolio-item">
                            <div class="portfolio-img">
                                <img class="img-fluid" [src]="image" alt="" loading="lazy">
                                <a class="popup-img portfolio-link" [href]="image"> <i class="far fa-plus"></i></a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
